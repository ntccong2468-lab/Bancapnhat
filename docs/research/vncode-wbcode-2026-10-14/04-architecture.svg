<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nhiều người sử dụng: mỗi máy vận hành độc lập" viewBox="0 0 1180 590"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d9bb4"/></marker></defs><rect width="1180" height="590" rx="18" fill="#101725"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="42" fill="#f3f6ff" font-size="24" font-weight="700">Nhiều người sử dụng: mỗi máy vận hành độc lập</text><text x="28" y="69" fill="#9dacc3" font-size="14">Website chung quản lý đăng ký / quyền dùng; dữ liệu vận hành giữ tại từng PC</text><rect x="30" y="115" width="325" height="165" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="45" y="144" fill="#ffffff" font-size="16" font-weight="700">Seller A / PC A</text><text x="45" y="170" fill="#becadf" font-size="13">VNCode · tối đa 10 shop theo license</text><text x="45" y="191" fill="#becadf" font-size="13">SQLite cục bộ + phân trang + snapshot</text><text x="45" y="212" fill="#becadf" font-size="13">Hàng đợi đọc / ghi / ảnh có giới hạn</text><text x="45" y="233" fill="#becadf" font-size="13">Job theo shop / posting / biến thể</text><text x="45" y="254" fill="#becadf" font-size="13">Checkpoint, reserve KIZ, PDF từng phần</text><rect x="425" y="115" width="325" height="165" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="440" y="144" fill="#ffffff" font-size="16" font-weight="700">Seller B / PC B</text><text x="440" y="170" fill="#becadf" font-size="13">VNCode · tối đa 10 shop theo license</text><text x="440" y="191" fill="#becadf" font-size="13">SQLite cục bộ + phân trang + snapshot</text><text x="440" y="212" fill="#becadf" font-size="13">Hàng đợi đọc / ghi / ảnh có giới hạn</text><text x="440" y="233" fill="#becadf" font-size="13">Job theo shop / posting / biến thể</text><text x="440" y="254" fill="#becadf" font-size="13">Checkpoint, reserve KIZ, PDF từng phần</text><rect x="825" y="115" width="325" height="165" rx="12" fill