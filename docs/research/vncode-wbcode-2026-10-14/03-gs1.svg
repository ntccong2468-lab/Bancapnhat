<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GS1 lấy thông tin từ tài khoản Znack đã xác thực" viewBox="0 0 1180 680"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d9bb4"/></marker></defs><rect width="1180" height="680" rx="18" fill="#101725"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="42" fill="#f3f6ff" font-size="24" font-weight="700">GS1 lấy thông tin từ tài khoản Znack đã xác thực</text><text x="28" y="69" fill="#9dacc3" font-size="14">CryptoPro cung cấp chữ ký; National Catalog / CZ cung cấp dữ liệu doanh nghiệp và GS1</text><rect x="30" y="110" width="325" height="110" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="45" y="139" fill="#ffffff" font-size="16" font-weight="700">1. Cấu hình Znack theo shop</text><text x="45" y="165" fill="#becadf" font-size="13">Chọn môi trường / INN / cert</text><text x="45" y="186" fill="#becadf" font-size="13">CryptoPro đọc owner, hạn, fingerprint</text><text x="45" y="207" fill="#becadf" font-size="13">Ký challenge → kiểm tra INN thực tế</text><rect x="425" y="110" width="325" height="110" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="440" y="139" fill="#ffffff" font-size="16" font-weight="700">2. Phiên dịch vụ đúng INN</text><text x="440" y="165" fill="#becadf" font-size="13">True API / ELK / SUZ / Catalog</text><text x="440" y="186" fill="#becadf" font-size="13">Phiên riêng, kiểm tra hạn và phạm vi</text><text x="440" y="207" fill="#becadf" font-size="13">Đổi cert / shop → hủy kết quả cũ</text><rect x="825" y="110" width="325" height="110" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="840" y="139" fill="#ffffff" font-size="16" font-weight="700">3. National Catalog / CZ</text><text x="840" y="165" fill="#becadf" font-size="13">GS1: thành viên, hạn, GCP, GLN</text><text x="840" y="186" fill="#becadf" font-size="13">Quota GTIN của từng tiền tố</text><text x="840" y="207" fill="#becadf" font-size="13">Hồ sơ: tên, INN, email, liên hệ</text><path d="M355,165 L425,165" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,165 L825,165" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="305" width="530" height="135" rx="12" fill="#1b2638" stroke="#38c7a0"/><text x="45" y="334" fill="#ffffff" font-size="16" font-weight="700">4. Bảng sáu kiểm tra</text><text x="45" y="360" fill="#becadf" font-size="13">Chứng thư · Đăng nhập CZ · Thỏa thuận</text><text x="45" y="381" fill="#becadf" font-size="13">Số dư đúng account · Thành viên GS1 · GTIN</text><text x="45" y="402" fill="#becadf" font-size="13">Thỏa thuận chưa có API xác minh → Chưa kiểm chứng</text><text x="45" y="423" fill="#becadf" font-size="13">Không biến thiếu dữ liệu thành trạng thái Đã đạt</text><rect x="620" y="305" width="530" height="135" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="635" y="334" fill="#ffffff" font-size="16" font-weight="700">5. Xin tiền tố / gia hạn / khôi phục</text><text x="635" y="360" fill="#becadf" font-size="13">Kiểm tra điều kiện thành viên và quota hiện tại</text><text x="635" y="381" fill="#becadf" font-size="13">Điền đơn từ hồ sơ → seller ký vẽ hoặc tải ảnh/PDF</text><text x="635" y="402" fill="#becadf" font-size="13">Word/PDF preview → seller xác nhận gửi</text><text x="635" y="423" fill="#becadf" font-size="13">Giữ bản dự kiến, trạng thái gửi và luồng trả lời</text><path d="M985,220 L985,270" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M985,270 L295,270" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M295,270 L295,305" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M560,365 L620,365" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="515" width="530" height="135" rx="12" fill="#1b2638" stroke="#e2ac53"/><text x="635" y="544" fill="#ffffff" font-size="16" font-weight="700">6. Hộp thư thật</text><text x="635" y="570" fill="#becadf" font-size="13">Email hồ sơ ≠ quyền truy cập hộp thư</text><text x="635" y="591" fill="#becadf" font-size="13">Cấu hình SMTP/IMAP OAuth hoặc app password</text><text x="635" y="612" fill="#becadf" font-size="13">TLS + bảo vệ credential; thư trả lời theo INN</text><text x="635" y="633" fill="#becadf" font-size="13">Đã gửi ≠ GS1 đã chấp thuận</text><rect x="30" y="515" width="530" height="135" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="45" y="544" fill="#ffffff" font-size="16" font-weight="700">7. Nhận kết quả và kiểm tra lại</text><text x="45" y="570" fill="#becadf" font-size="13">Hiển thị thư / hóa đơn / chứng từ / badge</text><text x="45" y="591" fill="#becadf" font-size="13">Đọc lại thành viên và quota từ Catalog</text><text x="45" y="612" fill="#becadf" font-size="13">Có tiền tố mới → tiếp tục tạo GTIN</text><text x="45" y="633" fill="#becadf" font-size="13">Không gửi nhắc thư nếu seller chưa cho phép</text><path d="M890,440 L890,515" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M620,572 L560,572" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/></g></svg>