<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng sản phẩm → GTIN → KIZ → in" viewBox="0 0 1240 645"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d9bb4"/></marker></defs><rect width="1240" height="645" rx="18" fill="#101725"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="42" fill="#f3f6ff" font-size="24" font-weight="700">Luồng sản phẩm → GTIN → KIZ → in</text><text x="28" y="69" fill="#9dacc3" font-size="14">Đề xuất nâng cấp · bước ghi cần xác nhận · thành công cần đọc lại kết quả</text><rect x="25" y="110" width="275" height="115" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="40" y="139" fill="#ffffff" font-size="16" font-weight="700">1. Sản phẩm WB / Ozon</text><text x="40" y="165" fill="#becadf" font-size="13">Chọn shop + biến thể + size</text><text x="40" y="186" fill="#becadf" font-size="13">Giấy tờ / brand / material / gender</text><text x="40" y="207" fill="#becadf" font-size="13">TN VED: gợi ý → seller xác nhận</text><rect x="340" y="110" width="275" height="115" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="355" y="139" fill="#ffffff" font-size="16" font-weight="700">2. Thẻ National Catalog</text><text x="355" y="165" fill="#becadf" font-size="13">Rà soát theo SKU, tách SKU lỗi</text><text x="355" y="186" fill="#becadf" font-size="13">GS1 / chứng thư / quyền hợp lệ</text><text x="355" y="207" fill="#becadf" font-size="13">Gửi → kiểm duyệt → ký CryptoPro</text><rect x="655" y="110" width="265" height="115" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="670" y="139" fill="#ffffff" font-size="16" font-weight="700">3. GTIN trên sàn</text><text x="670" y="165" fill="#becadf" font-size="13">Thêm vào đúng SKU / size</text><text x="670" y="186" fill="#becadf" font-size="13">Giữ barcode đang hoạt động</text><text x="670" y="207" fill="#becadf" font-size="13">Đọc lại WB / Ozon xác minh</text><rect x="960" y="110" width="255" height="115" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="975" y="139" fill="#ffffff" font-size="16" font-weight="700">4. KIZ đủ điều kiện</text><text x="975" y="165" fill="#becadf" font-size="13">Cần / Có / Phải mua</text><text x="975" y="186" fill="#becadf" font-size="13">Xác nhận mua phần thiếu</text><text x="975" y="207" fill="#becadf" font-size="13">Chờ mã/trạng thái pháp lý</text><path d="M300,169 L340,169" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M615,169 L655,169" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M920,169 L960,169" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="310" width="395" height="135" rx="12" fill="#1b2638" stroke="#38c7a0"/><text x="40" y="339" fill="#ffffff" font-size="16" font-weight="700">Đổi nhóm TN VED / tạo thẻ mới</text><text x="40" y="365" fill="#becadf" font-size="13">Thẻ cũ + GTIN cũ tiếp tục hoạt động</text><text x="40" y="386" fill="#becadf" font-size="13">Tạo candidate → ký → đưa lên sàn</text><text x="40" y="407" fill="#becadf" font-size="13">Đọc lại thành công → chuyển active</text><text x="40" y="428" fill="#becadf" font-size="13">Đơn / KIZ cũ giữ liên kết gốc</text><rect x="475" y="310" width="330" height="135" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="490" y="339" fill="#ffffff" font-size="16" font-weight="700">5. Lô đơn / shipment / FBO</text><text x="490" y="365" fill="#becadf" font-size="13">Preflight: Ready / Bị chặn / Thiếu mã</text><text x="490" y="386" fill="#becadf" font-size="13">Seller chọn xử lý riêng tập Ready</text><text x="490" y="407" fill="#becadf" font-size="13">Reserve KIZ → gửi đúng posting</text><text x="490" y="428" fill="#becadf" font-size="13">Checkpoint riêng từng đơn / SKU</text><rect x="860" y="310" width="355" height="135" rx="12" fill="#1b2638" stroke="#38c7a0"/><text x="875" y="339" fill="#ffffff" font-size="16" font-weight="700">6. Xác nhận và xuất / in</text><text x="875" y="365" fill="#becadf" font-size="13">Đọc lại sàn: gán KIZ đã được nhận</text><text x="875" y="386" fill="#becadf" font-size="13">PDF hoàn tất → in / xác nhận máy in</text><text x="875" y="407" fill="#becadf" font-size="13">Lịch sử + in lại từ kết quả đã nhận</text><text x="875" y="428" fill="#becadf" font-size="13">Lỗi một đơn không xóa kết quả lô</text><path d="M1088,225 L1088,270" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M1088,270 L640,270" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M640,270 L640,310" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M805,377 L860,377" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="500" width="740" height="105" rx="12" fill="#1b2638" stroke="#e2ac53"/><text x="490" y="529" fill="#ffffff" font-size="16" font-weight="700">Timeout / chưa rõ kết quả: đối chiếu trước khi tiếp tục</text><text x="490" y="555" fill="#becadf" font-size="13">Lưu UNKNOWN → đọc trạng thái bên ngoài → tiếp tục từ checkpoint.</text><text x="490" y="576" fill="#becadf" font-size="13">Không gửi lại tự động thao tác ghi; không giải phóng KIZ có khả năng đã được nhận.</text><path d="M1040,445 L1040,500" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/></g></svg>