<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="License Gmail → admin duyệt → key → nhiều máy" viewBox="0 0 1180 600"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d9bb4"/></marker></defs><rect width="1180" height="600" rx="18" fill="#101725"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="42" fill="#f3f6ff" font-size="24" font-weight="700">License Gmail → admin duyệt → key → nhiều máy</text><text x="28" y="69" fill="#9dacc3" font-size="14">Giữ đúng yêu cầu VNCode · ô nhập key luôn mở · website không xử lý đơn hàng / KIZ</text><rect x="30" y="115" width="330" height="110" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="45" y="144" fill="#ffffff" font-size="16" font-weight="700">Seller / máy A</text><text x="45" y="170" fill="#becadf" font-size="13">Nhập Gmail → bấm Đăng ký</text><text x="45" y="191" fill="#becadf" font-size="13">Không OTP, không mật khẩu web</text><text x="45" y="212" fill="#becadf" font-size="13">Hiện trạng thái Chờ admin duyệt</text><rect x="420" y="115" width="330" height="110" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="435" y="144" fill="#ffffff" font-size="16" font-weight="700">Portal vncode.id.vn</text><text x="435" y="170" fill="#becadf" font-size="13">Lưu tài khoản / Gmail đăng ký</text><text x="435" y="191" fill="#becadf" font-size="13">Danh sách chờ trong admin</text><text x="435" y="212" fill="#becadf" font-size="13">Quyền desktop do admin quyết định</text><rect x="810" y="115" width="340" height="110" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="825" y="144" fill="#ffffff" font-size="16" font-weight="700">Bạn / admin</text><text x="825" y="170" fill="#becadf" font-size="13">Duyệt Gmail → cấp key VNC</text><text x="825" y="191" fill="#becadf" font-size="13">Đặt số máy, shop, hạn, offline</text><text x="825" y="212" fill="#becadf" font-size="13">Gửi key riêng cho seller</text><path d="M360,167 L420,167" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,167 L810,167" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="305" width="340" height="130" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="825" y="334" fill="#ffffff" font-size="16" font-weight="700">Seller / máy B, C...</text><text x="825" y="360" fill="#becadf" font-size="13">Mở mục Nhập license bất kỳ lúc nào</text><text x="825" y="381" fill="#becadf" font-size="13">Nhập cùng key đã cấp</text><text x="825" y="402" fill="#becadf" font-size="13">Portal nhận tài khoản từ key</text><text x="825" y="423" fill="#becadf" font-size="13">Kiểm tra max_devices của key</text><rect x="420" y="305" width="330" height="130" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="435" y="334" fill="#ffffff" font-size="16" font-weight="700">Portal xác minh kích hoạt</text><text x="435" y="360" fill="#becadf" font-size="13">Key hợp lệ + tài khoản được duyệt</text><text x="435" y="381" fill="#becadf" font-size="13">Gắn thiết bị riêng vào quyền dùng</text><text x="435" y="402" fill="#becadf" font-size="13">Trả lease Ed25519 có chữ ký</text><text x="435" y="423" fill="#becadf" font-size="13">Đúng key_id / public key đã pin</text><rect x="30" y="305" width="330" height="130" rx="12" fill="#1b2638" stroke="#8b5cf6"/><text x="45" y="334" fill="#ffffff" font-size="16" font-weight="700">VNCode trên mỗi máy</text><text x="45" y="360" fill="#becadf" font-size="13">Kiểm tra chữ ký và danh tính</text><text x="45" y="381" fill="#becadf" font-size="13">Lưu trạng thái bảo vệ theo máy</text><text x="45" y="402" fill="#becadf" font-size="13">Dùng online / offline theo giới hạn</text><text x="45" y="423" fill="#becadf" font-size="13">Đọc lại quyền khi gia hạn / thu hồi</text><path d="M980,225 L980,305" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M810,370 L750,370" fill="none" stroke="#8d9bb4" stroke-width="2" marker-end="url(#arrow)"/><path d="M420,370 L36