-dontshrink
-dontoptimize
-verbose

-libraryjars <java.home>/jmods/java.base.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.desktop.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.sql.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.logging.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.naming.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.xml.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/jdk.crypto.ec.jmod(!**.jar;!module-info.class)

-keepattributes Signature,InnerClasses,EnclosingMethod,*Annotation*,Record,PermittedSubclasses,NestHost,NestMembers,Exceptions,SourceFile,LineNumberTable
-renamesourcefileattribute SRC
-printmapping target/proguard-mapping.txt
-keeppackagenames com.tuandev.fbsbarcode.**

-keep class com.tuandev.fbsbarcode.Launcher { public static void main(java.lang.String[]); }
-keep class com.tuandev.fbsbarcode.MainApplication { *; }
-keep class * extends javafx.application.Application { *; }
-keep class com.tuandev.fbsbarcode.ui.** { *; }
-keepclassmembers class com.tuandev.fbsbarcode.** {
    @javafx.fxml.FXML *;
}
-keepclassmembers class * implements javafx.fxml.Initializable {
    public void initialize(java.net.URL, java.util.ResourceBundle);
}

-keep class com.tuandev.fbsbarcode.integration.license.** { *; }
-keep class com.tuandev.fbsbarcode.integration.marketplace.** { *; }
-keep class com.tuandev.fbsbarcode.integration.ozon.** { *; }
-keep class com.tuandev.fbsbarcode.integration.update.UpdateInfo { *; }
-keep class com.tuandev.fbsbarcode.integration.wb.Wb*Response { *; }
-keep class com.tuandev.fbsbarcode.integration.wb.Wb*Dto { *; }
-keep class com.tuandev.fbsbarcode.integration.wb.WbProductCard { *; }
-keep class com.tuandev.fbsbarcode.integration.wb.WbStickerService$* { *; }
-keep class com.tuandev.fbsbarcode.integration.znack.ZnackModels { *; }
-keep class com.tuandev.fbsbarcode.integration.znack.ZnackModels$* { *; }
-keep class com.tuandev.fbsbarcode.dto.** { *; }
-keep class com.tuandev.fbsbarcode.models.** { *; }

-keep class com.tuandev.fbsbarcode.features.print.PrintTemplate { *; }
-keep class com.tuandev.fbsbarcode.features.print.PrintTemplateElement { *; }
-keep class com.tuandev.fbsbarcode.features.print.StickerText { *; }
-keep class com.tuandev.fbsbarcode.features.print.history.** { *; }
-keep class com.tuandev.fbsbarcode.features.fbo.Fbo* { *; }

-keepclassmembers class com.tuandev.fbsbarcode.** extends java.lang.Record { <fields>; <methods>; }
-keepclassmembers enum com.tuandev.fbsbarcode.** {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

-keepclasseswithmembernames,includedescriptorclasses class * { native <methods>; }

-dontnote **
-dontwarn javafx.**
-dontwarn okhttp3.**
-dontwarn okio.**
-dontwarn kotlin.**
-dontwarn org.bouncycastle.**
-dontwarn com.itextpdf.**
-dontwarn org.slf4j.**
-dontwarn org.apache.**
-dontwarn com.google.**
-dontwarn org.xerial.**
-dontwarn javax.**
