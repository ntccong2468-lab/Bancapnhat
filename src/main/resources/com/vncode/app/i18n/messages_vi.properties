znack.suz_auth.header=Честный ЗНАК từ chối thông tin kết nối УОТ/СУЗ (mã 1090)
znack.suz_auth.content=VN code đã tự động thử lại nhưng Честный ЗНАК vẫn không xác thực được kết nối. Hãy mở Cấu hình Znack của đúng cửa hàng và kiểm tra omsConnection, omsId, chữ ký số và INN có thuộc cùng một tài khoản hay không. Sau khi sửa cấu hình, hãy thử mua KIZ lại.
