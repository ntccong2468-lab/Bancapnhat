znack.operator_terms.title=Cần ký điều khoản mới trên Честный ЗНАК
znack.operator_terms.header=Честный ЗНАК đang chặn phát hành KIZ
znack.operator_terms.content=Bạn cần vào Честный ЗНАК và ký điều khoản mới. Sau khi ký, Честный ЗНАК có thể cần tối đa 48 giờ để xử lý.\n\nCách thực hiện:\n1. Vào Маркировка.\n2. Nhấn vào tên người dùng.\n3. Chọn Документы от оператора.\n4. Mở tài liệu có trạng thái Требует подписи và ký tài liệu.\n\nYêu cầu mua KIZ hiện tại đã dừng. Hệ thống sẽ không tự gửi lại liên tục; sau khi Честный ЗНАК xử lý xong, hãy thử mua lại.
