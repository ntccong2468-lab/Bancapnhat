guides.introduction=Nhập Gmail và bấm Đăng ký trong License và tài khoản, chờ quản trị viên duyệt rồi nhập khóa được cấp. Ô nhập khóa luôn mở, kể cả trên máy mới; số máy theo giới hạn admin cấp.
guides.wb.title=Thêm cửa hàng Wildberries
guides.wb.body=1. Trong tài khoản người bán WB, tạo API token có quyền phù hợp với công việc cần dùng.\n2. Chọn Thêm cửa hàng, chọn Wildberries, nhập tên và token.\n3. Chọn cửa hàng trên thanh trên cùng rồi Đồng bộ WB. Kiểm tra kết nối và danh sách đơn trước khi đóng hàng.
guides.ozon.title=Thêm cửa hàng Ozon
guides.ozon.body=1. Lấy Client ID và API key trong tài khoản người bán Ozon.\n2. Chọn Thêm cửa hàng, chọn Ozon và nhập thông tin kết nối.\n3. Chọn cửa hàng Ozon rồi đồng bộ. Mỗi cửa hàng có dữ liệu và thông tin kết nối riêng.
guides.labels.title=Đóng hàng và xuất nhãn
guides.labels.body=Mở Đóng hàng FBS, chọn đơn và lô hàng cần xử lý. Trong màn hình Supply, kiểm tra barcode WB, GTIN và trạng thái KIZ. Tích các tiêu chí sắp xếp theo nhu cầu, sau đó xuất nhãn. Kiểm tra bản xem trước và máy in trước khi chuyển sang giao hàng.
guides.gtin.title=GTIN, KIZ và TN VED
guides.gtin.body=Trong Công cụ → GTIN WB / Ozon, xem trước và xác nhận thêm GTIN vào đúng biến thể; barcode cũ được giữ. TN VED được tra cứu trong bước rà soát/sửa sản phẩm. Chỉ coi gán KIZ hoàn tất khi sàn đã xác nhận, sau đó xuất nhãn và in.
guides.update.title=Cập nhật VN code
guides.update.body=Sao lưu dữ liệu trước khi cập nhật. Chạy bộ cài VNCode mới để nâng cấp ứng dụng hiện có. VNCode giữ thư mục cài đặt và dữ liệu riêng. Sau khi nâng cấp, kiểm tra license trong License và tài khoản. Đọc ghi chú phát hành để biết các tính năng đã kiểm tra và phần còn đang phát triển.

