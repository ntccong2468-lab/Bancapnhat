guides.title=使用指南
guides.introduction=在许可证和账户中输入 Gmail 并点击注册，等待管理员批准后输入发放的密钥。新电脑也可随时输入密钥；设备数量由管理员设置。
guides.wb.title=添加 Wildberries 店铺
guides.wb.body=1. 在 WB 卖家账户中创建具有所需操作权限的 API 令牌。\n2. 点击添加店铺，选择 Wildberries，并输入名称和令牌。\n3. 在顶部选择店铺并同步 WB。在打包前检查连接和订单列表。
guides.ozon.title=添加 Ozon 店铺
guides.ozon.body=1. 从 Ozon 卖家账户获取 Client ID 和 API key。\n2. 点击添加店铺，选择 Ozon，并输入连接信息。\n3. 选择 Ozon 店铺并同步。每个店铺使用独立的数据和连接设置。
guides.labels.title=打包订单并导出标签
guides.labels.body=打开 FBS 打包并选择订单和供货批次。在 Supply 页面检查 WB 条码、GTIN 和 KIZ 状态。选择排序选项，然后导出标签。交付前检查预览和打印机。
guides.gtin.title=GTIN、KIZ 和 TN VED
guides.gtin.body=在工具 → GTIN WB / Ozon 中预览并确认向正确规格添加 GTIN；保留现有条码。审核或编辑商品时查询 TN VED。平台确认后才算完成 KIZ 绑定，然后导出并打印标签。
guides.update.title=更新 VN code
guides.update.body=更新前备份数据。运行新的 VNCode 安装程序以升级现有应用。VNCode 保留独立的安装和数据文件夹。升级后，请在许可证与账户中检查许可证。阅读发布说明，了解已验证功能和开发中的部分。

