znack.operator_terms.header=Honest Sign 已阻止签发 KIZ
znack.operator_terms.content=请登录 Honest Sign 并签署新条款。签署后，处理最长可能需要 48 小时。\n\n操作步骤：\n1. 打开 Маркировка。\n2. 点击用户名。\n3. 选择 Документы от оператора。\n4. 打开状态为 Требует подписи 的文件并签署。\n\n当前 KIZ 购买请求已停止。系统不会持续重复提交；请在 Honest Sign 处理完成后重新购买 KIZ。
