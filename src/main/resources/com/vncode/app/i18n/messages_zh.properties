znack.help.oms_id.title=如何获取 omsId
znack.help.oms_id.description=omsId 用于标识您的 SUZ 订单管理站。VN code 在订购 KIZ、检查状态和下载代码时会发送该值。
znack.help.oms_id.steps=1. 使用此店铺的证书登录 Honest Sign。\n2. 打开订单管理（SUZ）。\n3. 打开 SUZ 设置或站点资料，并复制其中显示的 omsId。\n4. 如果账户中未显示 omsId，请联系 Honest Sign 技术支持获取。
znack.help.oms_id.recognize=该值通常为 UUID，例如：cdf12109-10d3-11e6-8b6f-0050569977a1。请完整复制，不要添加空格。
znack.help.oms_id.warning=不要将设备连接标识符填入 omsId 字段。
znack.help.oms_connection.button=获取 omsConnection 的帮助
znack.help.oms_connection.title=如何获取 omsConnection
znack.help.oms_connection.description=omsConnection 用于标识获取动态 clientToken 的 SUZ 设备连接。
znack.help.oms_connection.steps=1. 登录 Honest Sign 并打开订单管理（SUZ）。\n2. 打开设备页面。\n3. 选择 VN code 使用的设备，或根据需要创建/注册设备。\n4. 将其连接标识符复制到此字段。
znack.help.oms_connection.recognize=使用设备连接标识符中显示的完整值。不要缩短或编辑。
znack.help.oms_connection.warning=omsConnection 属于设备连接，并不是 SUZ 的 omsId。
