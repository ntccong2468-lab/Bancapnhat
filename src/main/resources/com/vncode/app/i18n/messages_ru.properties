bulk.proposal.changed=Исходные данные предложения изменились. Откройте окно редактирования заново, проверьте и подтвердите новое предложение; изменения не отправлены.

znack.registration.reason.GTIN_VARIANT_UNVERIFIED=Не удалось проверить соответствие конкретного варианта: у товара или карточки Каталога не хватает данных о цвете или размере. Приложение сохраняет статус карточки и не считает этот GTIN проверенным.

znack.registration.latest_read_unknown=Не удалось проверить результат нового чтения; показан предыдущий полученный результат.
znack.registration.local_queue=Очередь в приложении
znack.registration.catalog_observation=Полученный статус карточки Каталога
znack.registration.catalog_checked_at=Время чтения Каталога
znack.registration.batch_paused=Приостановлено после текущей карточки; отправленные запросы по-прежнему проверяются.
znack.registration.confirm_cancel_pending=Будут отменены только карточки, отправка которых ещё не началась. Текущая карточка может быть обработана; отправленные запросы сохраняются для сверки результата. Продолжить?
znack.registration.signing_review=Проверьте данные карточки и подписанта перед подписанием
znack.registration.signing_review_scope=Проверенная область (учётная запись, ИНН, среда, сертификат)
znack.registration.reason.CATALOG_FEED_RESPONSE_INVALID=Не удалось прочитать результат обработки в Каталоге: структура ответа некорректна. Отправленный запрос сохранён для сверки и не будет автоматически отправлен повторно.
znack.registration.reason.CATALOG_SIGNING_REVIEW_REQUIRED=Не удалось подтвердить соответствие текущих данных карточки данным, одобренным для подписания. Проверьте актуальные данные и XML перед подтверждением подписи.
znack.registration.reason.CATALOG_SIGNING_ACKNOWLEDGEMENT_INVALID=Каталог вернул неоднозначное подтверждение приёма подписи. Отправка сохранена для сверки статуса до разрешения повторной попытки.
znack.registration.reason.ZNACK_INVALID_ATTRIBUTE_VALUE=Значение атрибута не соответствует текущей модели Каталога. Проверьте и исправьте поле, указанное в подробностях, перед отправкой карточки.
znack.registration.reason.CATALOG_NEW_GTIN_CONFIRMATION_REQUIRED=Для запроса нового GTIN и создания новой карточки требуется отдельное явное подтверждение. Приложение не запрашивало новый GTIN автоматически для этого действия.
znack.registration.reason.CATALOG_EXISTING_CARD_NOT_CONFIRMED=Не удалось подтвердить результат поиска существующей карточки в Каталоге. Приложение не считает карточку отсутствующей и не запрашивает новый GTIN автоматически.
znack.registration.reason.ZNACK_BATCH_PAUSED=Очередь приостановлена после текущей карточки. Отправленные запросы сохранены для сверки результата.
znack.registration.reason.ZNACK_BATCH_CANCELLED=Отменены карточки, отправка которых ещё не началась. Текущая карточка может быть обработана; отправленные запросы сохранены для сверки результата.
znack.registration.reason.ZNACK_BATCH_RETRY_LIMIT_REACHED=Очередь приостановлена после 5 безрезультатных повторных проверок. Изучите отчёт перед ручным продолжением; отправленные запросы сохранены для сверки.
znack.registration.reason.SIGNING_REVIEW_TOO_LARGE=Превышен предел просмотра перед подписанием: не более 1 000 карточек и 8 МиБ XML суммарно. Разделите выбранные карточки на меньшие группы для проверки и подписания.
znack.registration.reason.SIGNING_REVIEW_REQUIRED=Не удалось подтвердить соответствие текущих данных карточки данным, одобренным для подписания. Проверьте актуальные данные и XML перед подтверждением подписи.
znack.registration.reason.CATALOG_ENDPOINT_INVALID=Некорректный адрес подключения к Каталогу/TrueAPI (схема, порт или учётные данные в URL). Проверьте настройки подключения; запрос не отправлен. Это не означает, что GTIN не найден.
znack.registration.reason.CATALOG_EXISTING_CARD_LOOKUP_CLOSED=Сеанс поиска существующих карточек Каталога закрыт; результат не подтверждён, новый GTIN не запрашивался. Обновите данные и повторно проверьте точный товар и вариант перед продолжением.
znack.registration.reason.CATALOG_EXISTING_CARD_LOOKUP_INVALID=Данные поиска существующей карточки некорректны или недостаточны для сверки; новый GTIN не запрашивался. Обновите данные и изучите отчёт; это не означает, что карточка отсутствует.
znack.registration.reason.CATALOG_EXISTING_CARD_VARIANT_UNVERIFIED=Недостаточно данных для проверки точного варианта существующей карточки (артикул/модель, цвет, размер или ТН ВЭД); новый GTIN не запрашивался. Дополните данные и повторно проверьте вариант.
znack.registration.reason.CATALOG_EXISTING_CARD_VARIANT_CONFLICT=Найденная карточка Каталога не соответствует выбранному артикулу/модели, цвету или размеру; новый GTIN не запрашивался. Проверьте точный товар и вариант в отчёте перед продолжением.
znack.registration.reason.CATALOG_EXISTING_CARD_AMBIGUOUS=Для одного варианта найдены несколько результатов или противоречивые данные Каталога; новый GTIN не запрашивался. Изучите отчёт и определите точную карточку; первый результат не выбирается автоматически.
znack.registration.reason.CATALOG_EXISTING_CARD_READBACK_REQUIRED=Не удалось повторно прочитать найденную карточку Каталога для подтверждения результата; новый GTIN не запрашивался. Обновите статус и повторно проверьте точную карточку; это не означает, что она отсутствует.
znack.registration.reason.CATALOG_LIST_RANGE_UNSUPPORTED=Не удалось подтвердить полноту списка карточек Каталога: API поддерживает не более 1 000 строк на страницу и 10 000 карточек в проверенном диапазоне запроса. Новый GTIN не запрашивался; карточка не считается отсутствующей. Обновите данные с подходящим диапазоном; если карточек больше 10 000, уточните у поддержки правила разделения запросов.
znack.registration.reason.CATALOG_LIST_RESPONSE_INCOMPLETE=Каталог вернул не все страницы относительно заявленного количества. Результат не подтвержден; сохраненные данные сохранены, отсутствие карточки не установлено. Обновите данные для сверки.
znack.registration.signing_none_ready=При этом чтении не удалось подтвердить наличие карточек, готовых к подписанию. Проверьте статус каждой карточки и повторите сверку; подпись не отправлялась, карточки не изменялись.
