znack.registration.report_unverified=Не подтверждено
znack.registration.reason.SYNC_REPORT_CHANGED_RETRY=Отчёт изменился во время экспорта. Повторите экспорт после стабилизации сверки; предыдущий файл сохранён без изменений.
znack.registration.reason.GTIN_CONFIRM_SELECTED=Проверьте точный пакет товаров и подтвердите обновление GTIN.
znack.registration.reason.GTIN_WAIT_READBACK=Дождитесь обработки площадкой; приложение повторно прочитает результат без дублирования запроса.
znack.registration.reason.GTIN_RETRY_READBACK=Повторно сверьте GTIN точного варианта на площадке перед повторной отправкой.
znack.registration.reason.GTIN_REFRESH_PRODUCTS=Заново синхронизируйте товары с площадки и проверьте изменившийся вариант.
znack.registration.reason.GTIN_REVIEW_SOURCE=Проверьте карточку Каталога, GTIN и принадлежность; подробная причина указана для этой строки.
znack.registration.reason.GTIN_READBACK_COMPLETE=Повторное чтение подтвердило правильный GTIN у точного варианта на площадке.
znack.registration.reason.GTIN_VARIANT_IDENTITY_UNVERIFIED=Не удалось проверить артикул/модель, цвет, точный размер или ТН ВЭД варианта. Проверьте товар на площадке и карточку Каталога; GTIN на площадку не записывался.
znack.registration.reason.MARKETPLACE_REQUEST_REJECTED=Площадка отклонила запрос обновления. Изучите код ошибки и подробности этой строки, чтобы устранить причину; результат не считается ожидающим обработки.
znack.registration.reason.unverified_catalog_gtin=Недостаточно актуальных данных Каталога, чтобы подтвердить GTIN для нужной учётной записи и точного варианта. Заново синхронизируйте Каталог и проверьте карточку и принадлежность перед продолжением обновления GTIN.
znack.registration.reason.UNVERIFIED_CATALOG_GTIN=Недостаточно актуальных данных Каталога, чтобы подтвердить GTIN для нужной учётной записи и точного варианта. Заново синхронизируйте Каталог и проверьте карточку и принадлежность перед продолжением обновления GTIN.

