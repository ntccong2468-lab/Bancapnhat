kiz.pending.hint=Этикетки не выгружены. Остаток проверяется по каждому GTIN ниже; коды других GTIN не суммируются. Повторите печать, когда коды будут готовы.
kiz.pending.deficit=GTIN {0}: требуется {1}, доступно {2}, не хватает {3}.
kiz.pending.reason.queued=Недостающее количество поставлено в очередь; готовность новых кодов ещё не подтверждена.
kiz.pending.reason.existing=Запрошено продолжение существующей закупки без создания дубликата.
kiz.pending.reason.review=Коды или операции требуют проверки либо ввода в оборот. Проверьте склад КИЗ и настройки Znack; повторная закупка не создаётся.
