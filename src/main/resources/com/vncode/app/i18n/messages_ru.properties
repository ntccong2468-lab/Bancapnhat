znack.registration.preflight.checking_schema=Чтение актуальных товаров и обязательных полей Каталога…
znack.registration.preflight.review_next_fields=Проверьте поля ниже и нажмите Применить. Зависимые поля проверяются повторно до выделения GTIN.
znack.registration.reason.ZNACK_PREFLIGHT_READ_FAILED=Не удалось полностью прочитать товар или схему Каталога. GTIN не выделен, карточка не отправлена; повторите при доступном соединении.
znack.registration.reason.ZNACK_REVIEWED_VALUES_CHANGED=Данные товара или схема Каталога изменились после проверки. Запустите регистрацию для просмотра новых предложений; запрос сохранён, GTIN для этой попытки не выделен.
znack.registration.preflight.keep_document=Я проверил предупреждение и оставляю этот документ
znack.registration.preflight.review_too_large=Объём данных выбранной проверки слишком велик. Разделите выборку категорией или поиском и зарегистрируйте части; GTIN не выделен, карточки этой попытки не отправлены.

znack.registration.reason.CATALOG_REGISTRATION_SCHEMA_UNAVAILABLE=Не удалось полностью прочитать схему полей регистрации из Каталога. Проверьте соединение и повторите регистрацию; непроверенные поля не заполняются автоматически.
znack.registration.reason.CATALOG_COUNTRY_DICTIONARY_UNAVAILABLE=Не удалось прочитать справочник стран производства из Каталога. Проверьте соединение и повторите регистрацию, чтобы использовать верный код страны.
znack.registration.reason.CATALOG_COUNTRY_DICTIONARY_INVALID=Данные справочника стран, полученные от Каталога, некорректны или неполны согласно контракту API. Этот справочник не использован, карточка не отправлена; причина указана в подробностях.

# Country dictionary read diagnostics (internal application categories)
znack.registration.reason.CATALOG_COUNTRY_AUTH_REQUIRED=Каталог отказал в доступе к справочнику стран (401/403). Проверьте ключ API, учётную запись и среду; карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_RATE_LIMITED=Каталог ограничивает запросы к справочнику стран. Дождитесь окончания ограничения и повторите попытку; карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_ENDPOINT_UNAVAILABLE=API справочника стран недоступен (404). Проверьте настройки и контракт API; этот ответ не означает, что GTIN не найден.
znack.registration.reason.CATALOG_COUNTRY_SERVICE_UNAVAILABLE=При чтении справочника стран в Каталоге произошла ошибка сервера. Повторите позже; карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_TIMEOUT=Истекло время ожидания справочника стран. Страна не проверена, карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_DNS=Не удалось определить сетевой адрес API Каталога для чтения справочника стран. Проверьте подключение к сети.
znack.registration.reason.CATALOG_COUNTRY_TLS=При чтении справочника стран не удалось установить защищённое соединение с Каталогом. Проверьте сетевые сертификаты, прокси и системное время.
znack.registration.reason.CATALOG_COUNTRY_CONNECTION_FAILED=Соединение прервано при чтении справочника стран. Данные не проверены; карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_RESPONSE_HTML=Каталог вернул страницу HTML вместо справочника стран в формате JSON. Проверьте соединение, прокси и среду API; карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_RESPONSE_INVALID_JSON=Полученные от Каталога данные о странах не удалось прочитать в формате JSON. Эти данные не использованы, карточка не отправлена.
znack.registration.reason.CATALOG_COUNTRY_HTTP_ERROR=API справочника стран отклонил запрос. Код HTTP указан в подробностях; этот ответ не подтверждает, что GTIN неверен или отсутствует.
znack.registration.country.retry_after=Повторите попытку через {0} сек.
znack.registration.reason.CATALOG_COUNTRY_RESPONSE_EMPTY=При чтении справочника стран Каталог вернул пустой ответ. Данные не проверены; карточка не отправлена.
znack.registration.preflight.cancelled=Проверка перед регистрацией остановлена. GTIN не выделен, карточка не отправлена.

