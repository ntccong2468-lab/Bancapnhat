guides.title=Инструкции
guides.introduction=VN code — бесплатное приложение для личного использования. Настройте свои магазины и проверьте данные перед синхронизацией или экспортом этикеток.
guides.wb.title=Добавить магазин Wildberries
guides.wb.body=1. Создайте API-токен в кабинете продавца WB с правами для нужных операций.\n2. Нажмите Добавить магазин, выберите Wildberries, укажите название и токен.\n3. Выберите магазин в верхней панели и нажмите Синхронизировать WB. Проверьте подключение и список заказов перед упаковкой.
guides.ozon.title=Добавить магазин Ozon
guides.ozon.body=1. Получите Client ID и API key в кабинете продавца Ozon.\n2. Нажмите Добавить магазин, выберите Ozon и укажите данные подключения.\n3. Выберите магазин Ozon и выполните синхронизацию. Данные и настройки подключения каждого магазина хранятся отдельно.
guides.labels.title=Упаковка и экспорт этикеток
guides.labels.body=Откройте упаковку FBS и выберите заказы и поставку. На экране Supply проверьте штрихкод WB, GTIN и статус КИЗ. Выберите параметры сортировки и экспортируйте этикетки. Проверьте предпросмотр и принтер перед передачей в доставку.
guides.gtin.title=GTIN, КИЗ и ТН ВЭД
guides.gtin.body=Используйте KIZ Mapping для сопоставления кодов с товарами. В Инструментах откройте GTIN WB / Ozon, проверьте план добавления или замены GTIN и подтвердите изменения. В ТН ВЭД проверяйте источник и импортированный каталог. Статус КИЗ назначен означает локальное назначение в VN code; проверяйте результат синхронизации на площадке.
guides.update.title=Обновление VN code
guides.update.body=Сделайте резервную копию данных перед обновлением. Запустите новый установщик VN code для обновления приложения. VN code использует отдельные папки установки и данных и не требует лицензии WCode. Проверенные функции и незавершённые задачи указаны в примечаниях Preview.
