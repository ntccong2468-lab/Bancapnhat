znack.help.oms_id.button=Справка по получению omsId
znack.help.oms_id.title=Как получить omsId
znack.help.oms_id.description=omsId идентифицирует станцию управления заказами СУЗ. VN code передает его при заказе КИЗ, проверке статуса и скачивании кодов.
znack.help.oms_id.steps=1. Войдите в Честный ЗНАК с сертификатом этого магазина.\n2. Откройте Управление заказами (СУЗ).\n3. Откройте настройки СУЗ или профиль станции и скопируйте указанный omsId.\n4. Если omsId не отображается, запросите его в технической поддержке Честного ЗНАКа.
znack.help.oms_id.recognize=Обычно это UUID, например: cdf12109-10d3-11e6-8b6f-0050569977a1. Скопируйте значение полностью, без пробелов.
znack.help.oms_id.warning=Не вставляйте идентификатор соединения устройства в поле omsId.
znack.help.oms_connection.button=Справка по получению omsConnection
znack.help.oms_connection.title=Как получить omsConnection
znack.help.oms_connection.description=omsConnection идентифицирует соединение устройства СУЗ, используемое для получения динамического clientToken.
znack.help.oms_connection.steps=1. Войдите в Честный ЗНАК и откройте Управление заказами (СУЗ).\n2. Откройте раздел Устройства.\n3. Выберите устройство для VN code или создайте/зарегистрируйте его при необходимости.\n4. Скопируйте Идентификатор соединения в это поле.
znack.help.oms_connection.recognize=Используйте точное значение поля Идентификатор соединения устройства. Не сокращайте и не изменяйте его.
znack.help.oms_connection.warning=omsConnection относится к соединению устройства и не является omsId СУЗ.
