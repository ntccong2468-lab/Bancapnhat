znack.error.suz_auth_invalid=Не удалось проверить подключение УОТ/СУЗ магазина
znack.suz_auth.title=Не удалось проверить подключение к Честному ЗНАКу
znack.suz_auth.header=Честный ЗНАК отклонил учетные данные УОТ/СУЗ (ошибка 1090)
znack.suz_auth.content=VN code автоматически повторил запрос, но Честный ЗНАК по-прежнему не смог проверить подключение. Откройте настройки Znack нужного магазина и убедитесь, что omsConnection, omsId, электронная подпись и ИНН относятся к одной учетной записи. После исправления настроек повторите покупку КИЗ.
znack.insufficient_funds.title=Недостаточно средств в Честном ЗНАКе
znack.insufficient_funds.header=Невозможно продолжить покупку КИЗ
znack.insufficient_funds.content=На лицевом счёте Честного ЗНАКа недостаточно средств. Пополните баланс, затем вернитесь сюда и нажмите «Повторить». Текущий процесс покупки КИЗ сохранён.
znack.insufficient_funds.retry=Повторить
znack.operator_terms.title=Необходимо подписать новые условия в Честном ЗНАКе
znack.operator_terms.header=Выпуск КИЗ заблокирован Честным ЗНАКом
znack.operator_terms.content=Необходимо войти в Честный ЗНАК и подписать новые условия. После подписания обработка может занять до 48 часов.\n\nПорядок действий:\n1. Откройте раздел «Маркировка».\n2. Нажмите на имя пользователя.\n3. Выберите «Документы от оператора».\n4. Откройте документ со статусом «Требует подписи» и подпишите его.\n\nТекущий запрос на покупку КИЗ остановлен. Система не будет непрерывно повторять его; после завершения обработки в Честном ЗНАКе попробуйте купить КИЗ снова.
znack.missing_documents.title=Отсутствуют документы на товар
znack.missing_documents.header=Ввод КИЗ в оборот невозможен: у GTIN нет документов
znack.missing_documents.intro=У следующих GTIN нет действующей Декларации о соответствии или Сертификата соответствия:
znack.missing_documents.action=Опубликуйте или восстановите документ GTIN в Национальном каталоге, затем синхронизируйте GTIN. Когда документ станет действительным, система автоматически продолжит ввод приобретённых КИЗ в оборот.
