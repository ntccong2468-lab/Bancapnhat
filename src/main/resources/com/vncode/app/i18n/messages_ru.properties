guides.license.title=Регистрация Gmail и несколько ПК
guides.license.body=Gmail → регистрация → одобрение на vncode.id.vn → получение ключа → ввод в приложении. Новый ПК может сразу ввести тот же ключ. Администратор должен разрешить нужное число устройств; превышение лимита блокируется.
guides.gs1.title=ГС1, КриптоПро и почта
guides.gs1.body=Настройте ЧЗ для верного ИНН и сертификата. КриптоПро подписывает и подтверждает владельца; Национальный каталог предоставляет членство, срок, GCP/GLN, лимит и профиль. Непроверенное соглашение не считается действующим. Email заполняется из профиля; доступ SMTP/IMAP настраивается отдельно. Проверьте PDF перед отправкой; отправка не означает выдачу префикса.
guides.batch.title=Пакетная обработка заказов и SKU
guides.batch.body=Выберите результаты → проверьте готовность/GTIN/КИЗ → подтвердите нужную часть. Всегда сверяйте подтверждение площадки. Тайм-аут требует сверки без автоматического повтора записи. FBO использует GTIN варианта/размера; закажите недостающее в ЧЗ и повторите проверку после готовности КИЗ.
