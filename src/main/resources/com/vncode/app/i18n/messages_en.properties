guides.title=Guides
guides.introduction=Enter Gmail and select Register in License and account, wait for admin approval, then enter the issued key. Key entry is always available, including on a new PC; device limits are set by the admin.
guides.wb.title=Add a Wildberries shop
guides.wb.body=1. Create an API token in your WB seller account with permissions appropriate for your work.\n2. Select Add shop, choose Wildberries, and enter the name and token.\n3. Select that shop in the top bar and Sync WB. Check the connection and order list before packing.
guides.ozon.title=Add an Ozon shop
guides.ozon.body=1. Obtain the Client ID and API key from your Ozon seller account.\n2. Select Add shop, choose Ozon, and enter the connection details.\n3. Select the Ozon shop and sync. Each shop has separate data and connection settings.
guides.labels.title=Pack orders and export labels
guides.labels.body=Open FBS packing and select the orders and shipment. On the Supply screen, check the WB barcode, GTIN, and KIZ status. Choose the sorting options, then export labels. Review the preview and printer before moving the shipment to delivery.
guides.gtin.title=GTIN, KIZ and TN VED
guides.gtin.body=Use Tools → GTIN WB / Ozon to preview and confirm adding GTIN to the correct variant; existing barcodes are retained. Look up TN VED while reviewing or editing products. KIZ assignment is complete only after marketplace confirmation; then export labels and print.
guides.update.title=Update VN code
guides.update.body=Back up your data before updating. Run the new VNCode installer to upgrade the existing application. VNCode keeps its own installation and data folders. After upgrading, check your license under License and account. Read the release notes for verified features and work still in progress.

