znack.operator_terms.title=New Honest Sign terms require a signature
znack.operator_terms.header=Honest Sign has blocked KIZ issuance
znack.operator_terms.content=Sign the new terms in Honest Sign. Processing can take up to 48 hours after signing.\n\nSteps:\n1. Open Маркировка.\n2. Click the user name.\n3. Select Документы от оператора.\n4. Open the document marked Требует подписи and sign it.\n\nThe current KIZ purchase request has stopped. The app will not continuously resubmit it; try buying the KIZ again after Honest Sign finishes processing.
