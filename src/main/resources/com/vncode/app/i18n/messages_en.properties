znack.help.oms_id.title=How to get omsId
znack.help.oms_id.description=omsId identifies your Order Management Station (SUZ). VN code sends it with KIZ order, status, and download requests.
znack.help.oms_id.steps=1. Sign in to Honest Sign with the certificate used for this shop.\n2. Open Order Management (SUZ).\n3. Open the SUZ settings or station profile and copy the omsId shown there.\n4. If omsId is not visible for your account, request it from Honest Sign technical support.
znack.help.oms_id.recognize=It is normally a UUID, for example: cdf12109-10d3-11e6-8b6f-0050569977a1. Copy the complete value without spaces.
znack.help.oms_id.warning=Do not paste the device connection identifier into omsId.
znack.help.oms_connection.button=Help for getting omsConnection
znack.help.oms_connection.title=How to get omsConnection
znack.help.oms_connection.description=omsConnection identifies the SUZ device connection used to obtain a dynamic clientToken.
znack.help.oms_connection.steps=1. Sign in to Honest Sign and open Order Management (SUZ).\n2. Open Devices.\n3. Select the device used by VN code, or create/register one if required.\n4. Copy its Connection identifier into this field.
znack.help.oms_connection.recognize=Use the exact value shown as the device Connection identifier. Do not shorten or edit it.
znack.help.oms_connection.warning=omsConnection belongs to a device connection and is not the SUZ omsId.
