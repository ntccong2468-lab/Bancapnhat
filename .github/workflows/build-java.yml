name: Build & Test JavaFX Desktop App

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only the Windows test installer
        type: boolean
        default: true
      msi_inspection_only:
        description: Read-only inspection of the original MSI, no install/build/publication
        type: boolean
        default: false
  push:
    branches: [dev, main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  inspect-msi:
    if: ${{ inputs.msi_inspection_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect original MSI metadata without installation
        shell: pwsh
        run: ./tools/windows-side-by-side-smoke.ps1 -Version (node tools/release-version.mjs) -InspectOnly

  build-and-test:
    if: ${{ !inputs.msi_inspection_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: oracle
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve application version
        shell: pwsh
        run: '"APP_VERSION=$(node tools/release-version.mjs)" >> $env:GITHUB_ENV'

      - name: Verify JavaFX production and release contracts
        run: >-
          node --test tools/*.test.mjs

      - name: Run Java and FXML test suite
        shell: pwsh
        run: .\mvnw.cmd -B clean verify

      - name: Build unsigned JavaFX EXE installer
        shell: cmd
        env:
          # The preceding step verified this checkout and produced these exact JARs.
          VNCODE_REUSE_VERIFIED_BUILD: "true"
        run: build.bat exe

      - name: Verify native Windows launcher and schema-3 history migration
        shell: pwsh
        run: ./tools/windows-native-smoke.ps1 -Version $env:APP_VERSION

      - name: Verify installation beside WCode, fresh data and safe uninstall
        shell: pwsh
        run: ./tools/windows-side-by-side-smoke.ps1 -Version $env:APP_VERSION

      - name: Verify in-place upgrade from VN code 1.1.34 with saved data
        shell: pwsh
        run: ./tools/windows-upgrade-smoke.ps1 -Version $env:APP_VERSION

      - name: Verify upgrade from VN code 1.2.0 Preview with saved data
        if: env.APP_VERSION != '1.2.0'
        shell: pwsh
        run: ./tools/windows-upgrade-smoke.ps1 -Version $env:APP_VERSION -FromPreview

      - name: Verify upgrade from VN code 1.2.1 Preview with saved data
        if: env.APP_VERSION != '1.2.0' && env.APP_VERSION != '1.2.1'
        shell: pwsh
        run: ./tools/windows-upgrade-smoke.ps1 -Version $env:APP_VERSION -FromLatestPreview

      - name: Verify and name test installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out -Filter 'VN code*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -lt 1MB) {
            throw 'jpackage did not create exactly one non-empty EXE installer.'
          }
          $target = Join-Path $PWD "out\VN-code-$env:APP_VERSION-Windows-x64.exe"
          if ($installers[0].FullName -cne $target) {
            Move-Item -LiteralPath $installers[0].FullName -Destination $target -Force
          }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $PWD "out\VN-code-$env:APP_VERSION-Windows-x64.sha256"
          "$hash  VN-code-$env:APP_VERSION-Windows-x64.exe" | Set-Content $checksum -Encoding ascii

      - name: Preserve Windows test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VN-code-${{ env.APP_VERSION }}-Windows-x64
          path: |
            out/VN-code-${{ env.APP_VERSION }}-Windows-x64.exe
            out/VN-code-${{ env.APP_VERSION }}-Windows-x64.sha256
            out/native-smoke.json
            out/side-by-side-smoke.json
            out/upgrade-smoke.json
            out/upgrade-preview-smoke.json
            out/upgrade-latest-preview-smoke.json
          if-no-files-found: error
          retention-days: 14

  build-macos-test:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    name: Build macOS ${{ matrix.architecture }} test package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            expected_architecture: x86_64
            run_fxml_smoke: false
          - runner: macos-15
            architecture: arm64
            expected_architecture: arm64
            run_fxml_smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: oracle
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve application version
        run: 'echo "APP_VERSION=$(node tools/release-version.mjs)" >> "$GITHUB_ENV"'

      - name: Verify JavaFX production and release contracts
        run: >-
          node --test tools/*.test.mjs

      - name: Run Java and FXML test suite
        run: |
          set -euo pipefail
          if [[ "${{ matrix.run_fxml_smoke }}" == "true" ]]; then
            ./mvnw -B clean verify
          else
            # Platform.startup aborts inside Surefire on GitHub's virtual Intel Mac.
            # Windows and Apple Silicon still run the full FXML suite; Intel runs
            # every other test and the packaged native launcher smoke test below.
            ./mvnw -B -Dsurefire.excludes='**/FxmlSmokeTest.java' clean verify
          fi

      - name: Build and verify native macOS test packages
        run: |
          set -euo pipefail
          architecture="${{ matrix.architecture }}"
          expected_architecture="${{ matrix.expected_architecture }}"
          input="$PWD/target/jpackage-input"
          image_root="$PWD/test-image"
          image="$image_root/VN code.app"
          mkdir -p "$input/lib" "$image_root" out
          cp "target/VNcode-$APP_VERSION.jar" "$input/"
          cp -R target/lib/. "$input/lib/"

          jpackage --type app-image --name "VN code" --input "$input" \
            --main-jar "VNcode-$APP_VERSION.jar" \
            --main-class com.vncode.app.Launcher \
            --dest "$image_root" --app-version "$APP_VERSION" --vendor "VN code" \
            --mac-package-identifier com.vncode.app \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --jlink-options "--strip-native-commands --strip-debug --no-man-pages --no-header-files --bind-services"

          test -x "$image/Contents/MacOS/VN code"
          grep -F 'com.vncode.app.Launcher' "$image/Contents/app/VN code.cfg"
          file "$image/Contents/MacOS/VN code" | grep -F "$expected_architecture"

          smoke_data="$(mktemp -d "$RUNNER_TEMP/vncode-macos-smoke.XXXXXX")"
          smoke_log="$RUNNER_TEMP/vncode-macos-$architecture.log"
          JAVA_TOOL_OPTIONS="-Dvncode.appdata.dir=$smoke_data" \
            "$image/Contents/MacOS/VN code" >"$smoke_log" 2>&1 &
          smoke_pid=$!
          for attempt in {1..15}; do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              cat "$smoke_log"
              wait "$smoke_pid" || true
              echo "The packaged macOS $architecture launcher exited during startup." >&2
              exit 1
            fi
            [[ -s "$smoke_data/database.db" ]] && break
            sleep 1
          done
          test -s "$smoke_data/database.db"
          test "$(sqlite3 "$smoke_data/database.db" 'PRAGMA integrity_check;')" = "ok"
          if [[ -s "$smoke_data/logs/startup.log" ]]; then
            cat "$smoke_data/logs/startup.log"
            exit 1
          fi
          kill -TERM "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" || true

          ditto -c -k --sequesterRsrc --keepParent "$image" \
            "out/VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.zip"
          jpackage --type dmg --name "VN code" --app-image "$image" --dest out \
            --app-version "$APP_VERSION" --vendor "VN code"
          packages=(out/"VN code"*.dmg)
          test "${#packages[@]}" -eq 1
          mv "${packages[0]}" "out/VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.dmg"
          test -s "out/VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.dmg"
          test -s "out/VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.zip"
          (cd out && shasum -a 256 \
            "VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.dmg" \
            "VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.zip" \
            > "VN-code-$APP_VERSION-Ozon-Test-macos-$architecture.sha256")

      - name: Preserve macOS test packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VN-code-${{ env.APP_VERSION }}-Ozon-Test-macOS-${{ matrix.architecture }}
          path: |
            out/VN-code-${{ env.APP_VERSION }}-Ozon-Test-macos-${{ matrix.architecture }}.dmg
            out/VN-code-${{ env.APP_VERSION }}-Ozon-Test-macos-${{ matrix.architecture }}.zip
            out/VN-code-${{ env.APP_VERSION }}-Ozon-Test-macos-${{ matrix.architecture }}.sha256
          if-no-files-found: error
          retention-days: 14
