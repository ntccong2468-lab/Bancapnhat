name: Build & Test JavaFX Desktop App

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: oracle
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve application version
        shell: pwsh
        run: '"APP_VERSION=$(node tools/release-version.mjs)" >> $env:GITHUB_ENV'

      - name: Verify JavaFX production and release contracts
        run: >-
          node --test
          tools/javafx-production-entrypoint.test.mjs
          tools/release-version.test.mjs
          tools/update-manifest.test.mjs

      - name: Run Java and FXML test suite
        shell: pwsh
        run: .\mvnw.cmd -B clean verify

      - name: Build unsigned JavaFX EXE installer
        shell: cmd
        run: build.bat exe

      - name: Verify and name test installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out -Filter 'WCode*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -lt 1MB) {
            throw 'jpackage did not create exactly one non-empty EXE installer.'
          }
          $target = Join-Path $PWD "out\WCode-$env:APP_VERSION-Ozon-Test.exe"
          if ($installers[0].FullName -cne $target) {
            Move-Item -LiteralPath $installers[0].FullName -Destination $target -Force
          }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $PWD "out\WCode-$env:APP_VERSION-Ozon-Test.sha256"
          "$hash  WCode-$env:APP_VERSION-Ozon-Test.exe" | Set-Content $checksum -Encoding ascii

      - name: Preserve Windows test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WCode-${{ env.APP_VERSION }}-Ozon-Test-Windows-x64
          path: |
            out/WCode-${{ env.APP_VERSION }}-Ozon-Test.exe
            out/WCode-${{ env.APP_VERSION }}-Ozon-Test.sha256
          if-no-files-found: error
          retention-days: 14

  build-macos-test:
    name: Build macOS ${{ matrix.architecture }} test package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            expected_architecture: x86_64
            run_fxml_smoke: false
          - runner: macos-15
            architecture: arm64
            expected_architecture: arm64
            run_fxml_smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: oracle
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve application version
        run: 'echo "APP_VERSION=$(node tools/release-version.mjs)" >> "$GITHUB_ENV"'

      - name: Verify JavaFX production and release contracts
        run: >-
          node --test
          tools/javafx-production-entrypoint.test.mjs
          tools/release-version.test.mjs
          tools/update-manifest.test.mjs

      - name: Run Java and FXML test suite
        run: |
          set -euo pipefail
          if [[ "${{ matrix.run_fxml_smoke }}" == "true" ]]; then
            ./mvnw -B clean verify
          else
            # Platform.startup aborts inside Surefire on GitHub's virtual Intel Mac.
            # Windows and Apple Silicon still run the full FXML suite; Intel runs
            # every other test and the packaged native launcher smoke test below.
            ./mvnw -B -Dsurefire.excludes='**/FxmlSmokeTest.java' clean verify
          fi

      - name: Build and verify native macOS test packages
        run: |
          set -euo pipefail
          architecture="${{ matrix.architecture }}"
          expected_architecture="${{ matrix.expected_architecture }}"
          input="$PWD/target/jpackage-input"
          image_root="$PWD/test-image"
          image="$image_root/WCode.app"
          mkdir -p "$input/lib" "$image_root" out
          cp "target/FBSBarcode-$APP_VERSION.jar" "$input/"
          cp -R target/lib/. "$input/lib/"

          jpackage --type app-image --name WCode --input "$input" \
            --main-jar "FBSBarcode-$APP_VERSION.jar" \
            --main-class com.tuandev.fbsbarcode.Launcher \
            --dest "$image_root" --app-version "$APP_VERSION" --vendor TuanDev \
            --mac-package-identifier com.tuandev.wcode \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --jlink-options "--strip-native-commands --strip-debug --no-man-pages --no-header-files --bind-services"

          test -x "$image/Contents/MacOS/WCode"
          grep -F 'com.tuandev.fbsbarcode.Launcher' "$image/Contents/app/WCode.cfg"
          file "$image/Contents/MacOS/WCode" | grep -F "$expected_architecture"

          smoke_data="$(mktemp -d "$RUNNER_TEMP/wcode-macos-smoke.XXXXXX")"
          smoke_log="$RUNNER_TEMP/wcode-macos-$architecture.log"
          JAVA_TOOL_OPTIONS="-Dwcode.appdata.dir=$smoke_data" \
            "$image/Contents/MacOS/WCode" >"$smoke_log" 2>&1 &
          smoke_pid=$!
          for attempt in {1..15}; do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              cat "$smoke_log"
              wait "$smoke_pid" || true
              echo "The packaged macOS $architecture launcher exited during startup." >&2
              exit 1
            fi
            [[ -s "$smoke_data/database.db" ]] && break
            sleep 1
          done
          test -s "$smoke_data/database.db"
          test "$(sqlite3 "$smoke_data/database.db" 'PRAGMA integrity_check;')" = "ok"
          if [[ -s "$smoke_data/logs/startup.log" ]]; then
            cat "$smoke_data/logs/startup.log"
            exit 1
          fi
          kill -TERM "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" || true

          ditto -c -k --sequesterRsrc --keepParent "$image" \
            "out/WCode-$APP_VERSION-Ozon-Test-macos-$architecture.zip"
          jpackage --type dmg --name WCode --app-image "$image" --dest out \
            --app-version "$APP_VERSION" --vendor TuanDev
          packages=(out/WCode*.dmg)
          test "${#packages[@]}" -eq 1
          mv "${packages[0]}" "out/WCode-$APP_VERSION-Ozon-Test-macos-$architecture.dmg"
          test -s "out/WCode-$APP_VERSION-Ozon-Test-macos-$architecture.dmg"
          test -s "out/WCode-$APP_VERSION-Ozon-Test-macos-$architecture.zip"
          (cd out && shasum -a 256 \
            "WCode-$APP_VERSION-Ozon-Test-macos-$architecture.dmg" \
            "WCode-$APP_VERSION-Ozon-Test-macos-$architecture.zip" \
            > "WCode-$APP_VERSION-Ozon-Test-macos-$architecture.sha256")

      - name: Preserve macOS test packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WCode-${{ env.APP_VERSION }}-Ozon-Test-macOS-${{ matrix.architecture }}
          path: |
            out/WCode-${{ env.APP_VERSION }}-Ozon-Test-macos-${{ matrix.architecture }}.dmg
            out/WCode-${{ env.APP_VERSION }}-Ozon-Test-macos-${{ matrix.architecture }}.zip
            out/WCode-${{ env.APP_VERSION }}-Ozon-Test-macos-${{ matrix.architecture }}.sha256
          if-no-files-found: error
          retention-days: 14
