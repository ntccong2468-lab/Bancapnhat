name: Verify Published 1.4.10 upgrade to verified 1.4.11
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade-from-1410:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '25'
          distribution: oracle
      - name: Retrieve immutable successful 1.4.11 build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run=(& gh api repos/ntccong2468-lab/Bancapnhat/actions/runs/38731269718) | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.conclusion -cne 'success' -or $run.head_sha -cne '793850d5d29964164a46e774befe1fa6b991af00' -or $run.workflow_id -ne 379116841){throw 'Unverified Windows build source.'}
          gh run download 38731269718 --repo ntccong2468-lab/Bancapnhat --name VN-code-1.4.11-Windows-x64 --dir out
          if($LASTEXITCODE -ne 0){throw 'Cannot retrieve verified installer.'}
          gh run download 38731269718 --repo ntccong2468-lab/Bancapnhat --name VN-code-1.4.11-Windows-verified-java --dir target
          if($LASTEXITCODE -ne 0){throw 'Cannot retrieve verified Java inputs.'}
      - name: Verify Published 1.4.10 to 1.4.11 upgrade preserving data
        shell: pwsh
        run: ./tools/windows-upgrade-1410-smoke.ps1 -Version 1.4.11 -FromStable1410
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: VN-code-1.4.11-upgrade-from-Published-1.4.10
          path: |
            out/upgrade-stable-1410-smoke.json
            out/upgrade-1.4.10-*.log
          if-no-files-found: warn
          retention-days: 14
