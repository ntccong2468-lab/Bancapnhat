name: Verify 1.5.19 updater MSI on disposable Windows

on:
  workflow_dispatch:
    inputs:
      reuse_verified_java_run_id:
        description: Successful Windows baseline run providing the exact candidate files
        required: true
        type: string
      recover_fixture_failure_run_id:
        description: Exact source commit recorded in the candidate build
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  updater-msi-proof:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.reuse_verified_java_run_id }}
      EXPECTED_SOURCE: ${{ inputs.recover_fixture_failure_run_id }}
      LOCALAPPDATA: ${{ runner.temp }}\vncode-updater-proof-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '25'
          distribution: oracle
      - name: Download and verify the exact previously tested candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN_ID -cnotmatch '^[0-9]+$' -or $env:EXPECTED_SOURCE -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid run or source identifier.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/publish-vncode-baseline.yml' -or $run.repository.full_name -cne $env:GITHUB_REPOSITORY) { throw 'The candidate build was not successfully verified.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'vncode-exact-candidate'
          gh run download $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'VN-code-1.6.0-complete-baseline' --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the candidate artifact.' }
          $info = Get-Content -LiteralPath (Join-Path $candidate 'build-info.json') -Raw | ConvertFrom-Json
          if ($info.version -cne '1.6.0' -or $info.sourceCommit -cne $env:EXPECTED_SOURCE -or -not $info.verification.fullJavaSuiteRun -or -not $info.verification.nativeSmokeRun -or -not $info.verification.baselineUpgradeRun) { throw 'Candidate identity or verification does not match.' }
          $checksums = Get-Content -LiteralPath (Join-Path $candidate 'SHA256SUMS')
          foreach ($line in $checksums) {
            if ($line -cnotmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Malformed checksum entry.' }
            $expected = $Matches[1]; $name = $Matches[2]; $file = Join-Path $candidate $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw "Candidate checksum mismatch: $name" }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $candidate 'asset-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -cne $env:EXPECTED_SOURCE -or $manifest.version -cne '1.6.0') { throw 'Candidate manifest identity mismatch.' }
          $msiName = 'VN-code-1.6.0-Windows-x64.msi'
          $msi = Get-Item -LiteralPath (Join-Path $candidate $msiName)
          $entry = $manifest.files.$msiName
          if (-not $entry -or $msi.Length -ne $entry.bytes -or (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) { throw 'Candidate MSI bytes differ from the manifest.' }
          "CANDIDATE_DIR=$candidate" >> $env:GITHUB_ENV
      - name: Exercise installed 1.5.19 updater and exact MSI without seller credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'vncode-updater-msi-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          ./tools/windows-updater-msi-proof.ps1 -CandidateRoot $env:CANDIDATE_DIR -ExpectedSource $env:EXPECTED_SOURCE -ExpectedRunId ([long]$env:BUILD_RUN_ID) -ProofPath (Join-Path $evidence 'proof.json')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: updater-msi-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/vncode-updater-msi-evidence
          if-no-files-found: warn
          retention-days: 7
