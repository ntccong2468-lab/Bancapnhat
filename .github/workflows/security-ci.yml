name: Security and workflow checks

on:
  pull_request:
  push:
    branches: [dev, develop, 'dev/**']
  # GitHub runs schedules on the default branch; CodeQL scans the whole checkout.
  schedule:
    - cron: '37 4 * * 0'
  workflow_dispatch:

# PR code is untrusted. This workflow has no deployment credentials or write access.
permissions:
  contents: read
  actions: read

jobs:
  openqodex-scan:
    # A clean scheduled checkout may have no diff: do not present it as a full scan.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Explicit scanner-only mode: this is not an independent AI review.
      - name: Scan changed files without an AI reviewer
        id: openqodex
        uses: openqodex/openqodex@6d879d65de94ab201bddd9ccad76e1d1bcff70ca # openqodex@0.16.0
        with:
          version: '0.16.0'
          review: 'off'
          upload-sarif: 'false'
          block-on-severity: major
          fail-on-tool-error: 'true'
          config-from: base
      # Upstream can return success even if an individual selected scanner fails.
      - name: Check scanner health
        if: always() && steps.openqodex.outcome != 'skipped'
        run: node tools/openqodex-health-gate.mjs "$RUNNER_TEMP"
      # No raw source snippets, paths, reasons or potentially unrecognized secrets.
      - name: Preserve sanitized scanner health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openqodex-scanner-health
          path: ${{ runner.temp }}/openqodex-health-summary.json
          if-no-files-found: error
          retention-days: 14

  lint-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check workflow syntax and expressions
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # This job checks Actions/YAML syntax; it does not claim a ShellCheck or Pyflakes pass.
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Check portal JavaScript syntax
        working-directory: website/license-portal
        run: npm run check
      - name: Install portal dependencies without lifecycle scripts
        working-directory: website/license-portal
        run: npm ci --ignore-scripts
      - name: Test portal
        working-directory: website/license-portal
        run: npm test
      - name: Test release and security tools
        run: node --test tools/*.test.mjs
      - name: Audit the portal lockfile, including development dependencies
        working-directory: website/license-portal
        run: npm audit --package-lock-only --audit-level=high

  changed-dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository for dependency review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject newly introduced high or critical vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
          license-check: false

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        if: matrix.language == 'java-kotlin'
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          tools: linked
      - name: Compile Java for analysis
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -DskipTests clean compile
      - name: Analyze without write permissions
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
      - name: Gate on high, critical or unclassified security findings
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/codeql-results/*.sarif)
          (( ${#reports[@]} > 0 )) || { echo 'CodeQL produced no SARIF report.' >&2; exit 1; }
          node tools/codeql-sarif-gate.mjs "${reports[@]}"
      - name: Preserve CodeQL findings for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 14
