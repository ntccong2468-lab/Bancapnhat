name: Build complete VNCode baseline
on:
  push:
    branches: [release/vn-code-1.5.11]
    paths: [.github/workflows/publish-vncode-baseline.yml]
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      rebuild_current:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit to verify and package
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  # Builds only read Latest and run on isolated Windows workers. Serialize repeat
  # builds of the same immutable source without blocking unrelated release refs.
  group: vncode-complete-baseline-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: windows-2022
    # The 17 Nov unfiltered Java run alone took 150 minutes. Keep time for the
    # existing UI preflight and native/install/upgrade checks without skipping them.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE: ${{ inputs.source_commit || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '25'
          distribution: oracle
          cache: maven
      - name: Pin exact source and currently published baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:EXPECTED_SOURCE -cnotmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD).Trim() -cne $env:EXPECTED_SOURCE){throw 'Source changed.'}
          $version=(node tools/release-version.mjs).Trim()
          if($LASTEXITCODE -ne 0){throw 'Invalid version declarations.'}
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          $mode=if('${{ inputs.rebuild_current }}' -ceq 'true'){'previous-current'}else{'previous'}
          node tools/baseline-release.mjs $mode "$env:RUNNER_TEMP/baseline-pinned"
          if($LASTEXITCODE -ne 0){throw 'Cannot pin previous public baseline.'}
          $baseline=Get-Content "$env:RUNNER_TEMP/baseline-pinned/previous-baseline.json" -Raw | ConvertFrom-Json
          "BASELINE_UPGRADE_REQUIRED=$((-not $baseline.skipUpgrade).ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Configure transient worker animation for JavaFX verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $motion=Join-Path $env:RUNNER_TEMP "baseline-motion-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force $motion | Out-Null
          "VNCODE_CI_MOTION_ROOT=$motion" >> $env:GITHUB_ENV
          $helper=Join-Path $env:GITHUB_WORKSPACE 'tools/diagnostics/windows-motion-environment.ps1'
          $state=Join-Path $motion 'original-motion-state.json'
          & $helper -Mode Snapshot -StateFile $state -EvidenceFile "$motion/native-original.json" | Out-Host
          & $helper -Mode Enable -StateFile $state -EvidenceFile "$motion/native-enabled.json" | Out-Host
      - name: Verify release tools
        run: node --test tools/*.test.mjs
      - name: Verify fresh JVM motion preferences and original OS accessibility authority
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\vncode-baseline-motion-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          .\mvnw.cmd -B test-compile dependency:build-classpath '-DincludeScope=test' '-Dmdep.outputFile=target/ci-motion-classpath.txt'
          if($LASTEXITCODE -ne 0){throw 'Motion probe compilation prerequisites failed.'}
          $deps=(Get-Content target/ci-motion-classpath.txt -Raw).Trim()
          $classpath="target/ci-motion-probe;target/classes;$deps"
          New-Item -ItemType Directory -Force target/ci-motion-probe | Out-Null
          & javac -encoding UTF-8 -cp "target/classes;$deps" -d target/ci-motion-probe tools/diagnostics/WindowsMotionPreferenceProbe.java
          if($LASTEXITCODE -ne 0){throw 'Standalone public preference probe did not compile.'}
          $helper=Join-Path $env:GITHUB_WORKSPACE 'tools/diagnostics/windows-motion-environment.ps1'
          $motion=$env:VNCODE_CI_MOTION_ROOT
          $state=Join-Path $motion 'original-motion-state.json'
          try {
            & java --enable-native-access=ALL-UNNAMED -cp $classpath com.vncode.tools.diagnostics.WindowsMotionPreferenceProbe "$motion/normal-public-preferences.json" false 2>&1 | Tee-Object "$motion/normal-public-preferences.log" | Out-Host
            if($LASTEXITCODE -ne 0){throw 'Fresh JavaFX process did not observe normal worker motion.'}
            & $helper -Mode Disable -StateFile $state -EvidenceFile "$motion/native-reduced.json" | Out-Host
            & java --enable-native-access=ALL-UNNAMED -cp $classpath com.vncode.tools.diagnostics.WindowsMotionPreferenceProbe "$motion/reduced-public-preferences.json" true 2>&1 | Tee-Object "$motion/reduced-public-preferences.log" | Out-Host
            if($LASTEXITCODE -ne 0){throw 'Production runtime did not honor OS reduced motion.'}
          } finally {
            & $helper -Mode Enable -StateFile $state -EvidenceFile "$motion/native-normal-before-preflight.json" | Out-Host
          }
      - name: Verify Windows UI, purchase circulation, product documents and Catalog fixtures
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\vncode-baseline-preflight-${{ github.run_id }}
        run: |
          # Verify the byte-pinned default after Windows checkout before the long suite.
          .\mvnw.cmd -B '-Dtest=Gs1OfficialPrefixTemplateTest,Gs1PrefixRequestDialogTest' test
          if($LASTEXITCODE -ne 0){throw 'Windows GS1 default template preflight failed.'}
          .\mvnw.cmd -B '-Dtest=OzonFbsUiTest,Gs1AgreementDialogTest,Gs1AgreementPaneTest,Gs1JoinDialogWorkflowTest,Gs1JoinFormValidationContractTest,Gs1JoinChecklistTest,Gs1SyncReportDialogTest,OzonKizOnlyUiTest,ProductCategoryMultiSelectTest,CategoryFilterMenuLimitTest,OperatorAgreementReplayTest,NationalCatalogGs1ReplayTest,FxmlSmokeTest,OzonLabelServiceTest,MavenWrapperIntegrityTest,ZnackRegistrationBatchHttpIntegrationTest,FashionTnvedBrowserTest,ZnackCardRegistrationControllerTest,CryptoProCertificateDiscoveryServiceTest,ZnackCertificateDiscoveryUiTest,CryptoProCertificateRoutingTest,RegistrationDocumentConfigDialogTest,ZnackSettingsAreaRepositoryTest,ZnackCirculationPolicyTest,ZnackOwnedCisReadbackTest,ZnackIntroductionSubmissionOutcomeTest,ZnackCirculationMessagesTest,KizPurchaseStatusPresentationTest,ProductRefreshBatchRegressionTest,ProductDocumentVerificationReadbackTest,OzonDocumentReadbackIntegrityTest,OzonCatalogPaginationTest,ProductRefreshUiTest,ThemeDialogBackingTest,ThemeServiceTest,WorkspaceAllSurfaceGlassTest,WorkspaceBackdropMaterialTest,WorkspaceDialogChromeTest,WorkspaceGlobalMotionContractTest,WorkspaceInteractionMotionTest,WorkspaceMaterialRenderingTest,WorkspaceMotionBoundaryTest,WorkspaceRoundedControlClipTest,WorkspaceRouteContinuityTest,ReferenceThemeAccessibilityTest,ProductBulkDialogTest,ProductColumnHierarchyTest,ProductReferenceLayoutTest,ProductSelectionSmoothnessTest,HomeControllerPageTransitionTest,WorkspaceChromeUiTest,WorkspaceListAreaTest,NativeGlassEvidenceTest' test
          if($LASTEXITCODE -ne 0){throw 'Windows fixture preflight failed.'}
          # A fresh JavaFX process inherits the desktop pointer left by preflight.
          # Exercise that boundary before starting the long, unfiltered full suite.
          .\mvnw.cmd -B '-Dtest=FashionTnvedBrowserTest' test
          if($LASTEXITCODE -ne 0){throw 'Repeated native pointer preflight failed.'}
      - name: Verify whole Java application and package
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\vncode-baseline-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          # CI worker setup only: production still gives OS accessibility precedence.
          $motion=$env:VNCODE_CI_MOTION_ROOT
          $motionHelper=Join-Path $env:GITHUB_WORKSPACE 'tools/diagnostics/windows-motion-environment.ps1'
          & $motionHelper -Mode Enable -StateFile (Join-Path $motion 'original-motion-state.json') -EvidenceFile "$motion/native-normal-before-full.json" | Out-Host
          $motionDeps=(Get-Content target/ci-motion-classpath.txt -Raw).Trim()
          & java --enable-native-access=ALL-UNNAMED -cp "target/ci-motion-probe;target/classes;$motionDeps" com.vncode.tools.diagnostics.WindowsMotionPreferenceProbe "$motion/normal-public-before-full.json" false 2>&1 | Tee-Object "$motion/normal-public-before-full.log" | Out-Host
          if($LASTEXITCODE -ne 0){throw 'Worker motion changed before the unfiltered full suite.'}
          $nativeInput=Join-Path $env:RUNNER_TEMP "baseline-native-input-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force $nativeInput | Out-Null
          $observer=Join-Path $env:GITHUB_WORKSPACE 'tools/diagnostics/windows-input-observer.ps1'
          # Console interference in the original full runs is still unproven.
          # Preserve read-only OS evidence without exposing another observer console.
          & $observer -Directory $nativeInput -Mode Snapshot -ParentProcessId $PID | Out-Host
          $nativeInputWatch=$null
          try {
            $nativeInputWatch=Start-Process pwsh -WindowStyle Hidden -PassThru -ArgumentList @('-NoProfile','-File',"`"$observer`"",'-Directory',"`"$nativeInput`"",'-Mode','Observe','-ParentProcessId',"$PID",'-MaxSeconds','11000')
            .\mvnw.cmd -B clean verify
            if($LASTEXITCODE -ne 0){throw 'Full Windows Java verification failed.'}
          } finally {
            try {
              New-Item -ItemType File -Force (Join-Path $nativeInput 'windows-input.stop') | Out-Null
              if($null -ne $nativeInputWatch){
                $nativeInputWatch.Refresh()
                if(-not $nativeInputWatch.HasExited -and -not $nativeInputWatch.WaitForExit(10000)){
                  Stop-Process -InputObject $nativeInputWatch -Force
                }
              }
            } catch { Write-Warning 'Native input observer cleanup failed.' }
            finally { if($null -ne $nativeInputWatch){$nativeInputWatch.Dispose()} }
          }
      - name: Build final EXE from verified Java
        id: package
        shell: cmd
        env:
          VNCODE_REUSE_VERIFIED_BUILD: 'true'
        run: build.bat exe
      - name: Restore pinned baseline after installer packaging
        shell: pwsh
        run: Copy-Item "$env:RUNNER_TEMP/baseline-pinned/previous-baseline.json" out/previous-baseline.json
      - name: Verify native migration and startup
        shell: pwsh
        run: ./tools/windows-native-smoke.ps1 -Version $env:APP_VERSION
      - name: Verify actual Windows data protection
        shell: pwsh
        run: ./tools/windows-gs1-smoke.ps1 -Version $env:APP_VERSION
      - name: Verify fresh install, coexistence and uninstall
        shell: pwsh
        run: ./tools/windows-side-by-side-smoke.ps1 -Version $env:APP_VERSION
      - name: Verify passive upgrade from pinned current Latest
        if: env.BASELINE_UPGRADE_REQUIRED == 'true'
        shell: pwsh
        run: ./tools/windows-baseline-upgrade-smoke.ps1 -Version $env:APP_VERSION -BaselineManifest out/previous-baseline.json
      - name: Record same-version rebuild scope
        if: env.BASELINE_UPGRADE_REQUIRED != 'true'
        shell: pwsh
        run: |
          @{version=$env:APP_VERSION;result='same-version-rebuild';baselineUpgradeRun=$false} | ConvertTo-Json | Set-Content out/upgrade-baseline-smoke.json -Encoding utf8NoBOM
      - name: Preserve final MSI before building portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item "target/jpackage-temp/msi/VN code-$env:APP_VERSION.msi" "out/VN-code-$env:APP_VERSION-Windows-x64.msi"
          $saved=Join-Path $env:RUNNER_TEMP 'baseline-installer-proofs'
          New-Item -ItemType Directory -Force $saved | Out-Null
          Copy-Item out/* $saved -Recurse
      - name: Build complete portable runtime from same verified Java
        shell: cmd
        env:
          VNCODE_REUSE_VERIFIED_BUILD: 'true'
        run: build.bat app-image
      - name: Restore the original worker desktop preferences
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $motion=Join-Path $env:RUNNER_TEMP "baseline-motion-$env:GITHUB_RUN_ID"
          $state=Join-Path $motion 'original-motion-state.json'
          if(Test-Path $state){
            & ./tools/diagnostics/windows-motion-environment.ps1 -Mode Restore -StateFile $state -EvidenceFile "$motion/native-restored.json" | Out-Host
          }
      - name: Package all source, Git history, runtime and verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=$env:APP_VERSION
          Copy-Item "$env:RUNNER_TEMP/baseline-installer-proofs/*" out -Recurse
          $installers=@(Get-ChildItem out -Filter 'VN code*.exe' -File)
          if($installers.Count -ne 1){throw 'Expected exactly one final installer.'}
          $name="VN-code-$version-Windows-x64.exe"
          Move-Item $installers[0].FullName "out/$name"
          $hash=(Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "out/VN-code-$version-Windows-x64.sha256" -Encoding ascii
          Compress-Archive -Path 'out/VN code' -DestinationPath "out/VN-code-$version-Windows-x64.zip"
          git archive --format=zip "--prefix=VN-code-$version-source/" -o "out/VN-code-$version-source.zip" HEAD
          if($LASTEXITCODE -ne 0){throw 'Source archive failed.'}
          git bundle create "out/VN-code-$version-history.bundle" --all
          if($LASTEXITCODE -ne 0){throw 'History bundle failed.'}
          git bundle verify "out/VN-code-$version-history.bundle"
          if($LASTEXITCODE -ne 0){throw 'History bundle verification failed.'}
          Copy-Item "docs/releases/VN-code-$version.md" out/release-notes.md
          $proof=Join-Path $env:RUNNER_TEMP 'baseline-verification'
          New-Item -ItemType Directory -Force $proof | Out-Null
          Copy-Item target/surefire-reports $proof -Recurse
          Copy-Item out/*smoke.json,out/previous-baseline.json $proof
          Copy-Item target/gtin-bulk-*.json $proof
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "baseline-native-input-$env:GITHUB_RUN_ID") -Destination $proof -Recurse
          Copy-Item -LiteralPath $env:VNCODE_CI_MOTION_ROOT -Destination $proof -Recurse
          Compress-Archive -Path "$proof/*" -DestinationPath "out/VN-code-$version-verification.zip"
          $tests=0;$failures=0;$errors=0;$skipped=0
          foreach($report in Get-ChildItem target/surefire-reports -Filter 'TEST-*.xml'){
            [xml]$xml=Get-Content $report.FullName -Raw
            $tests+=[int]$xml.testsuite.tests;$failures+=[int]$xml.testsuite.failures;$errors+=[int]$xml.testsuite.errors;$skipped+=[int]$xml.testsuite.skipped
          }
          if($tests -lt 2800 -or $failures -ne 0 -or $errors -ne 0){throw 'Full Java evidence missing or failed.'}
          $info=[ordered]@{version=$version;sourceCommit=$env:EXPECTED_SOURCE;runId=[long]$env:GITHUB_RUN_ID;runAttempt=[int]$env:GITHUB_RUN_ATTEMPT;workflow='publish-vncode-baseline.yml';installer=@{name=$name;bytes=(Get-Item "out/$name").Length;sha256=$hash};verification=@{fullJavaSuiteRun=$true;java=@{tests=$tests;failures=$failures;errors=$errors;skipped=$skipped;passed=$tests-$skipped};nativeSmokeRun=$true;baselineUpgradeRun=($env:BASELINE_UPGRADE_REQUIRED -ceq 'true');legacyUpgradeMatrixRun=$false;liveCatalogWriteVerified=$false;liveMarketplaceWriteVerified=$false;paidKizPurchaseVerified=$false}}
          $info | ConvertTo-Json -Depth 8 | Set-Content out/build-info.json -Encoding utf8NoBOM
          node tools/baseline-release.mjs manifest out $env:EXPECTED_SOURCE
          if($LASTEXITCODE -ne 0){throw 'Complete baseline manifest failed.'}
      - name: Preserve installer and all rebuild inputs
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VN-code-${{ env.APP_VERSION }}-complete-baseline
          path: |
            out/VN-code-*.exe
            out/VN-code-*.msi
            out/VN-code-*.zip
            out/VN-code-*.sha256
            out/VN-code-*.bundle
            out/*.json
            out/SHA256SUMS
            out/release-notes.md
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed verification reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-failed-verification-${{ github.run_id }}
          path: |
            target/surefire-reports/TEST-*.xml
            out/*.json
            ${{ runner.temp }}/baseline-native-input-${{ github.run_id }}/
            ${{ runner.temp }}/baseline-motion-${{ github.run_id }}/
          if-no-files-found: ignore
