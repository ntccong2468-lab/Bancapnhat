name: Upload verified VNCode 1.6.0 draft assets
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ntccong2468-lab/Bancapnhat
      EXPECTED_SOURCE: 07e2b7dd7225b283131574050287e3ab24ec7394
      EXPECTED_DRAFT_ID: '430401567'
    steps:
      - name: Download and verify the completed build artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$REPOSITORY" ]]
          gh api "repos/$REPOSITORY/actions/runs/41276029647" | jq -e '.status == "completed" and .conclusion == "success" and .path == ".github/workflows/publish-vncode-baseline.yml" and .head_branch == "ci/vn-code-1.6.0-windows-2022"' >/dev/null
          mkdir -p "$RUNNER_TEMP/vncode-verified"
          gh run download 41276029647 --repo "$REPOSITORY" --name VN-code-1.6.0-complete-baseline --dir "$RUNNER_TEMP/vncode-verified"
          cd "$RUNNER_TEMP/vncode-verified"
          jq -e --arg source "$EXPECTED_SOURCE" '.version == "1.6.0" and .sourceCommit == $source and .verification.fullJavaSuiteRun == true and .verification.nativeSmokeRun == true and .verification.baselineUpgradeRun == true and .verification.java.failures == 0 and .verification.java.errors == 0' build-info.json >/dev/null
          jq -e --arg source "$EXPECTED_SOURCE" '.version == "1.6.0" and .sourceCommit == $source and (.files | length == 11)' asset-manifest.json >/dev/null
          sha256sum -c SHA256SUMS
          files=(VN-code-1.6.0-Windows-x64.exe VN-code-1.6.0-Windows-x64.msi VN-code-1.6.0-Windows-x64.sha256 VN-code-1.6.0-Windows-x64.zip VN-code-1.6.0-source.zip VN-code-1.6.0-history.bundle VN-code-1.6.0-verification.zip build-info.json release-notes.md native-smoke.json upgrade-baseline-smoke.json asset-manifest.json SHA256SUMS gs1-smoke.json side-by-side-smoke.json previous-baseline.json)
          actual=(*)
          [[ ${#actual[@]} -eq ${#files[@]} ]]
          for name in "${files[@]}"; do
            [[ -f "$name" && ! -L "$name" ]]
            if jq -e --arg name "$name" '.files | has($name)' asset-manifest.json >/dev/null; then
              expected_hash=$(jq -r --arg name "$name" '.files[$name].sha256' asset-manifest.json)
              expected_size=$(jq -r --arg name "$name" '.files[$name].bytes' asset-manifest.json)
              [[ "$(sha256sum "$name" | cut -d' ' -f1)" == "$expected_hash" && "$(stat -c '%s' "$name")" == "$expected_size" ]]
            fi
          done
      - name: Upload exact assets only to the verified draft
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vncode-verified"
          files=(VN-code-1.6.0-Windows-x64.exe VN-code-1.6.0-Windows-x64.msi VN-code-1.6.0-Windows-x64.sha256 VN-code-1.6.0-Windows-x64.zip VN-code-1.6.0-source.zip VN-code-1.6.0-history.bundle VN-code-1.6.0-verification.zip build-info.json release-notes.md native-smoke.json upgrade-baseline-smoke.json asset-manifest.json SHA256SUMS gs1-smoke.json side-by-side-smoke.json previous-baseline.json)
          check_draft() {
            gh api "repos/$REPOSITORY/releases/latest" | jq -e '.tag_name == "v1.5.19" and .draft == false' >/dev/null
            draft=$(gh api "repos/$REPOSITORY/releases/$EXPECTED_DRAFT_ID")
            jq -e --arg source "$EXPECTED_SOURCE" '.id == 430401567 and .draft == true and .prerelease == false and .tag_name == "v1.6.0" and .target_commitish == $source' <<<"$draft" >/dev/null
          }
          for name in "${files[@]}"; do
            check_draft
            digest="sha256:$(sha256sum "$name" | cut -d' ' -f1)"
            bytes=$(stat -c '%s' "$name")
            count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$draft")
            if [[ "$count" == 0 ]]; then
              gh release upload v1.6.0 "$name" --repo "$REPOSITORY"
            else
              [[ "$count" == 1 ]]
              jq -e --arg name "$name" --arg hash "$digest" --argjson bytes "$bytes" '[.assets[] | select(.name == $name and .state == "uploaded" and .digest == $hash and .size == $bytes)] | length == 1' <<<"$draft" >/dev/null
            fi
          done
          check_draft
          [[ "$(jq '.assets | length' <<<"$draft")" == "${#files[@]}" ]]
          for name in "${files[@]}"; do
            digest="sha256:$(sha256sum "$name" | cut -d' ' -f1)"
            bytes=$(stat -c '%s' "$name")
            jq -e --arg name "$name" --arg hash "$digest" --argjson bytes "$bytes" '[.assets[] | select(.name == $name and .state == "uploaded" and .digest == $hash and .size == $bytes)] | length == 1' <<<"$draft" >/dev/null
          done
          echo 'All 16 exact artifacts are attached to the draft and verified; nothing was published.'
