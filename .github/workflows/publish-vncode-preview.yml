name: Publish verified VN code Windows preview
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d17ced942afd4231ca6821013c34e0e1ee11e11c
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify release tool contracts
        run: node --test tools/*.test.mjs
      - name: Publish exact verified preview with checksums and smoke evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/publish-vncode-preview.mjs 37984754861 v1.2.2-preview.1
