name: Publish verified VN code Windows preview
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact commit of the successful Windows build
        required: true
        type: string
      build_run_id:
        description: Successful build-java.yml run ID for that commit
        required: true
        type: string
      preview_tag:
        description: Preview tag matching pom.xml, for example v1.4.0-preview.1
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Acceptance metadata is recorded after the build. The publisher checks exact inputs.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify release tool contracts
        run: node --test tools/*.test.mjs
      - name: Publish exact verified preview with checksums and smoke evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
          BUILD_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: node tools/publish-vncode-preview.mjs "$BUILD_RUN_ID" "$PREVIEW_TAG" "$BUILD_SOURCE_COMMIT"
