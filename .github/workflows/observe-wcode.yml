name: Wbcode 1.3.8 desktop audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Launch checksum-verified reference fixture in a fresh Windows runner
        shell: pwsh
        run: ./tools/windows-wcode-ui-observe.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wbcode-1.3.8-desktop-audit
          path: out/wcode-observation/*
          if-no-files-found: error
