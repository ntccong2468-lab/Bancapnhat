name: Observe official Wbcode release UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Launch checksum-verified official Wbcode in a fresh Windows runner
        shell: pwsh
        run: ./tools/windows-wcode-ui-observe.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-Wbcode-1.3.0-UI-observation
          path: out/wcode-observation/*
          if-no-files-found: error
