name: Publish verified VN Code 1.6.1
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: vncode-stable-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ntccong2468-lab/Bancapnhat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --test tools/*.test.mjs
      - name: Verify pinned build, publish assets, and switch Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-vncode-161.mjs
      - name: Preserve publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VN-code-1.6.1-publication
          path: publication-1.6.1.json
          if-no-files-found: error
