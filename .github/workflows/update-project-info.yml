name: Update VN code publication metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vncode-publication-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Update descriptions and verify unchanged installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/update-publication.mjs
